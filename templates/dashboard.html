{% extends "base.html" %}
{% block content %}
<!-- ============ DASHBOARD ============ -->
<div class="screen" id="screen-dashboard">
  <div class="app-header">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div class="brand-name">Gridline</div>
    </div>
    <div class="header-right">
      <div class="user-chip"><div class="user-avatar"></div> <span id="user-email-chip">Account</span></div>
      <a class="logout-link" id="logout-link">Log out</a>
    </div>
  </div>

  <div class="dash-body">
    <div class="dash-top">
      <div>
        <div class="dash-title">Accounts</div>
        <div class="dash-sub" id="dash-sub">Loading…</div>
      </div>
      <button class="btn-add-account" id="btn-add-account">+ Add account</button>
    </div>

    <div class="account-grid" id="account-grid">
      <!-- populated from /api/accounts -->
    </div>
  </div>

  <div class="account-modal" id="account-modal" hidden>
    <div class="account-modal-panel" role="dialog" aria-modal="true" aria-labelledby="account-modal-title">
      <div class="account-modal-head">
        <div>
          <div class="dash-title" id="account-modal-title">Connect account</div>
          <div class="dash-sub">Add a trading account to your workspace.</div>
        </div>
        <button class="account-modal-close" id="account-modal-close" type="button" aria-label="Close">×</button>
      </div>
      <form id="account-form">
        <div class="field">
          <label for="account-name">Account name</label>
          <input id="account-name" name="name" type="text" placeholder="Gold Scalper - Live" required>
        </div>
        <div class="field">
          <label for="account-broker">Broker / server</label>
          <input id="account-broker" name="broker_label" type="text" value="MT5" required>
        </div>
        <div class="account-modal-actions">
          <button class="btn-secondary" id="account-cancel" type="button">Cancel</button>
          <button class="btn-primary account-submit" type="submit">Connect account</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
