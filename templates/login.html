{% extends "base.html" %}
{% block content %}
<!-- ============ LOGIN ============ -->
<div class="screen" id="screen-login">
  <div class="page-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">G</div>
        <div class="brand-name">Gridline</div>
      </div>
      <div class="login-sub">Sign in to manage your limit grids</div>
      <div class="field">
        <label>Email</label>
        <input type="text" id="login-email" placeholder="you@domain.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••••">
      </div>
      <button class="btn-primary" id="login-submit-btn">Sign in</button>
      <div class="login-foot">
        <a href="#" id="login-mode-toggle">Create account instead</a>
      </div>
    </div>
  </div>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/login.js"></script>
<script>
  const el = document.getElementById('screen-login');
  if(el) el.classList.add('active');
</script>
{% endblock %}
